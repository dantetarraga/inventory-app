name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockpro
          POSTGRES_PASSWORD: stockpro
          POSTGRES_DB: stockpro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://stockpro:stockpro@localhost:5432/stockpro
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stockpro
          POSTGRES_PASSWORD: stockpro
          POSTGRES_DB: stockpro
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockpro" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://stockpro:stockpro@localhost:5432/stockpro
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @stockpro/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
